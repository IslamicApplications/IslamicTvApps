# Builds the Android TV app (android/) and publishes the APK as a GitHub release, so a
# TV can install it from a fixed link:
#   https://github.com/IslamicApplications/IslamicTvApps/releases/latest/download/DailyHadithAzan-TV.apk
# The app shows https://islamicapplications.github.io/IslamicTvApps/, so changes to the
# web app reach it without a new APK; a new APK is only needed when android/ changes.
name: Android TV app

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.0'

      # The release key from the repo secrets (the same key every time, so TVs can update)
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Check the signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
          cp "$APK" DailyHadithAzan-TV.apk

      - uses: actions/upload-artifact@v7
        with:
          name: DailyHadithAzan-TV-${{ env.VERSION_NAME }}
          path: DailyHadithAzan-TV.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v$VERSION_NAME" DailyHadithAzan-TV.apk \
            --title "Android TV app $VERSION_NAME" \
            --latest \
            --notes "Install on Google TV / Android TV: see the README (Android TV app). Download: DailyHadithAzan-TV.apk below, or always the newest at https://github.com/${{ github.repository }}/releases/latest/download/DailyHadithAzan-TV.apk"
