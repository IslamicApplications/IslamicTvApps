# Publishes the dev branch to https://islamicapplications.github.io/IslamicTvApps/dev/
# so changes can be tried on a TV before they reach main. Only the dev/ folder of
# gh-pages changes: the live site, and the TVs running it, are left alone. The dev
# copy has its own version.json, so it never makes a live TV reload.
name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build

      - name: Deploy to gh-pages/dev
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # Retried in case the daily prayer-times deploy pushes gh-pages at the same moment
          for attempt in 1 2 3; do
            git fetch origin gh-pages
            rm -rf ../ghp
            git worktree prune
            git worktree add --detach ../ghp origin/gh-pages
            cd ../ghp
            rm -rf dev
            mkdir dev
            cp -R "$GITHUB_WORKSPACE/dist/." dev/
            git add -A dev
            if git diff --cached --quiet; then echo "Dev site unchanged."; exit 0; fi
            git commit -m "Deploy dev: ${GITHUB_SHA::7}"
            # Pushed from the main checkout, which holds the push credentials
            if git -C "$GITHUB_WORKSPACE" push origin "$(git rev-parse HEAD):refs/heads/gh-pages"; then exit 0; fi
            cd "$GITHUB_WORKSPACE"
            sleep 10
          done
          exit 1
